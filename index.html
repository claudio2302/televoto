<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>LISTA CONCORRENTI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* Colori Gradiente */
            --gradient-start: #00796B; 
            --gradient-mid: #03A9F4;  
            --gradient-end-dark: #004488;  
            --gradient-end-accent: #9C27B0; /* Viola */
            /* Colori Interfaccia */
            --primary-blue: #2196F3; /* Card e Nome Voto */
            --secondary-button: #00BCD4; /* Turchese/Azzurro Acceso */
            --danger-color: #EF5350;
            --rank-color: #9C27B0; /* Viola Classifica */
            --avg-color-light: #4DD0E1; /* Azzurro Chiaro NUOVO */
            --card-bg: var(--primary-blue);
            --visited-bg: #4FC3F7; 
            --shadow-light: rgba(0,0,0,0.2);
            --shadow-heavy: rgba(0,0,0,0.4);
        }

        /* --- STILI BASE --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 40%, var(--gradient-end-dark) 80%, var(--gradient-end-accent) 100%);
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { margin-bottom: 20px; font-weight: 800; text-shadow: 2px 2px 4px var(--shadow-heavy); font-size: 2.5rem; text-align: center; }

        /* --- CONTAINER LISTA --- */
        #listaPartecipanti {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 15px var(--shadow-light);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            position: relative;
            min-height: 180px;
            text-align: center;
        }

        .card.visited { background-color: var(--visited-bg); opacity: 0.9; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px var(--shadow-heavy); }

        .card-name { font-size: 1.4rem; font-weight: 600; margin-bottom: 10px; color: #fff; }

        .vote-info { font-size: 0.95rem; margin-bottom: 15px; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-weight: 400; }

        .btn-vota {
            background-color: var(--secondary-button);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-vota:hover { background-color: #0097A7; transform: scale(1.05); }

        /* --- OVERLAY CLASSIFICA --- */
        #finalRankingOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            overflow-y: auto;
        }

        #finalRankingOverlay.active { display: flex; }

        /* Contenitore Podio */
        .podium-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 450px;
            margin-top: 50px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 15px;
        }

        .podium-step {
            width: 200px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-bottom: none;
            border-radius: 15px 15px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 10px;
            position: relative;
            transition: height 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            opacity: 0;
            visibility: hidden;
        }

        .podium-step.visible { opacity: 1; visibility: visible; }

        .step-3 { height: 150px; order: 1; border-color: #cd7f32; box-shadow: 0 0 20px rgba(205,127,50,0.3); }
        .step-1 { height: 280px; order: 2; border-color: #ffd700; box-shadow: 0 0 30px rgba(255,215,0,0.4); width: 250px; }
        .step-2 { height: 200px; order: 3; border-color: #c0c0c0; box-shadow: 0 0 20px rgba(192,192,192,0.3); }

        .podium-rank { font-size: 3rem; font-weight: 800; margin-bottom: 10px; line-height: 1; }
        .step-1 .podium-rank { color: #ffd700; font-size: 4.5rem; }
        .step-2 .podium-rank { color: #c0c0c0; }
        .step-3 .podium-rank { color: #cd7f32; }

        .podium-name { font-size: 1.3rem; font-weight: 600; text-align: center; opacity: 0; transition: opacity 0.5s ease; }
        .podium-score { font-size: 1.1rem; color: #4DD0E1; margin-top: 5px; opacity: 0; transition: opacity 0.5s ease; }

        .podium-step.show-name .podium-name, 
        .podium-step.show-name .podium-score { opacity: 1; }

        /* Immagine Transizione */
        #rankingTransitionImg {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            max-width: 80%; max-height: 80%;
            z-index: 1001;
            display: none;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* --- BOTTONI ADMIN --- */
        .admin-controls { margin-top: 40px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .btn-admin { padding: 12px 25px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .btn-ranking { background: var(--rank-color); color: white; }
        .btn-reset { background: var(--danger-color); color: white; }

        /* Utility */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1><i class="fas fa-users"></i> PARTECIPANTI</h1>

    <div id="listaPartecipanti">
        </div>

    <div id="finalRankingOverlay">
        <h1 id="rankingTitle" style="color: #ffd700; margin-top: 20px;">CLASSIFICA FINALE</h1>
        
        <img id="rankingTransitionImg" src="logo_podio.png" alt="Podio">

        <div class="podium-container">
            <div id="podiumPos3" class="podium-step step-3">
                <div class="podium-rank">3°</div>
                <div class="podium-name">???</div>
                <div class="podium-score">0.00</div>
            </div>
            <div id="podiumPos1" class="podium-step step-1">
                <div class="podium-rank">1°</div>
                <div class="podium-name">???</div>
                <div class="podium-score">0.00</div>
            </div>
            <div id="podiumPos2" class="podium-step step-2">
                <div class="podium-rank">2°</div>
                <div class="podium-name">???</div>
                <div class="podium-score">0.00</div>
            </div>
        </div>

        <p style="color: #aaa; margin-top: 40px;">Premi [INVIO] o [SPAZIO] per procedere</p>
    </div>

    <div class="admin-controls">
        <button class="btn-admin btn-ranking" onclick="apriClassificaFinale()">VAI ALLA CLASSIFICA</button>
        <button class="btn-admin btn-reset" onclick="resetCompleto()">RESET</button>
    </div>
    
    <audio id="vittoriaAudio" src="vittoria.mp3" preload="auto"></audio>

    <div id="yt-player-container" style="position:fixed; top:-1000px; left:-1000px; pointer-events:none;">
        <div id="youtube-player"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase_init.js"></script>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            caricaPartecipanti();
            
            if (window.db) {
                caricaConteggiVoti();
            } else {
                window.addEventListener('firebaseReady', caricaConteggiVoti);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (window.page3Active && (e.key === ' ' || e.key === 'Enter')) { 
                e.preventDefault(); 
                
                if (window.podiumState >= 4) { 
                    // Ferma audio standard
                    if (window.vittoriaAudio && !window.vittoriaAudio.paused) {
                        window.vittoriaAudio.pause();
                        window.vittoriaAudio.currentTime = 0; 
                    }
                    // AGGIUNTA: Ferma YouTube se attivo
                    if (window.ytPlayer && window.ytPlayer.stopVideo) {
                        window.ytPlayer.stopVideo();
                    }
                    
                    window.closeFinalRankingView();
                } else { 
                    window.showNextRankingRow();
                }
                return; 
            }
        });
    </script>
</body>
</html>
